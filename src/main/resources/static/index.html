<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="auth-section" class="auth-container">

<h2>Sign up or Log in</h2>

<button onclick="toSignUp()">Sign up</button>
<button onclick="toLogIn()">Log in</button>

</div>

<div id="sign-up-section" class="sign-up-container">

<h2>Sign up</h2>

<input id="newUsername" placeholder="Username">
<input id="newPassword" type="password" placeholder="Password">

<button onclick="signUp()">Sign up</button>

</div>

<div id="log-in-section" class="log-in-container">

    <h2>Log in</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="logIn()">Log in</button>

    <h3 id="statusLabel"></h3>
</div>

<div id="app-section" class="container">
    <h1>Task Manager</h1>

    <div>
        <h2 id="WelcomeLabel">Welcome back to the task manager {Insert Username}!</h2>
    </div>

    <div class="task-form">
        <input type="text" id="taskInput" placeholder="Enter task name..."/>
        <input type="text" id="descriptionInput" placeholder="Enter task description..."/>

        <label for="due-date">Select a Due Date:</label>

        <input type="date" id="due-date" name="task-due" value="2026-05-17">

        <button onclick="addTask()">Add Task</button>
    </div>

    <div class="filters">
        <select name="filters" id="filters" onchange="getTasks(document.getElementById('filters').value)">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="incomplete">Incomplete</option>
        </select>

        <select name="dueDateFilters" id="dueDateFilters"
                onchange="getTasks(document.getElementById('dueDateFilters').value)">
            <option value="all">All</option>
            <option value="upcoming">Upcoming</option>
            <option value="today">Due Today</option>
            <option value="overdue">Overdue</option>
        </select>
    </div>

    <div class="log-out-container">
        <button onclick="LogOut()">Log out</button>
    </div>

    <h2>Tasks</h2>
    <ul id="taskList"></ul>


    <script src="script.js"></script>
</div>
</body>
</html>
